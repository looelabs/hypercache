[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercache-io"
version = "0.9.1"
description = "HyperCache: Host-Local NVMe Caching and Zero-Copy Direct Block DMA / GPUDirect Storage Acceleration for AI Workloads"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "Looe Labs" }
]
keywords = ["ai", "pytorch", "safetensors", "vllm", "nvme", "gpudirect", "cache", "s3", "fsspec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "fsspec>=2023.1.0",
    "numpy>=1.22.0",
]

[project.urls]
Homepage = "https://github.com/looelabs/hypercache"
Repository = "https://github.com/looelabs/hypercache"
Issues = "https://github.com/looelabs/hypercache/issues"

[project.optional-dependencies]
gpu = [
    "kvikio-cu12>=24.0.0",
    "cupy-cuda12x>=12.0.0",
    "torch>=2.0.0",
    "numpy>=1.22.0",
]
dev = [
    "torch>=2.0.0",
    "safetensors>=0.4.0",
    "boto3>=1.28.0",
    "requests>=2.28.0",
    "pytest>=7.0.0",
    "numpy>=1.22.0",
]

[project.entry-points."fsspec.specs"]
hypercache = "hypercache.fsspec_fs:HyperCacheFileSystem"

[tool.setuptools.packages.find]
where = ["."]
include = ["hypercache*"]
