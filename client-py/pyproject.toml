[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercache"
version = "0.9.0b1"
description = "HyperCache: Host-Based Zero-Copy GPUDirect Storage Cache for AI Models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fsspec>=2023.1.0",
    "numpy>=1.22.0",
]

[project.optional-dependencies]
gpu = [
    "kvikio-cu12>=24.0.0",
    "cupy-cuda12x>=12.0.0",
    "torch>=2.0.0",
    "numpy>=1.22.0",
]
dev = [
    "torch>=2.0.0",
    "safetensors>=0.4.0",
    "boto3>=1.28.0",
    "requests>=2.28.0",
    "pytest>=7.0.0",
    "numpy>=1.22.0",
]

[project.entry-points."fsspec.specs"]
hypercache = "hypercache.fsspec_fs:HyperCacheFileSystem"
