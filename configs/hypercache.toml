# HyperCache Control Plane Configuration

# Device discovery mode: "auto" (detect all host physical/virtual NVMe/SSDs), "manual" (use explicit list)
device_discovery_mode = "auto"

# Virtual drive support: allows virtualized disks (e.g. /dev/vdc, /dev/vdb, /dev/xvdf)
allow_virtual_drives = true

# Include partitions in discovery (e.g. /dev/vdc1, /dev/nvme0n1p1)
include_partitions = true

# Allowed block device prefixes
device_prefixes = ["nvme", "vd", "xvd", "sd"]

# Optional filter: target specific drive or partition (e.g. "vdc1" or "vd*" or leave empty for all)
device_filter = ""

# Automatically exclude OS root filesystem drive from cache striping pool
exclude_root_device = true

# Fallback mock pattern & count for dev/CI environments if no physical/virtual drives exist
dev_mock_device_pattern = "/tmp/hypercache_nvme*.raw"
dev_mock_auto_count = 4

# Physical raw block devices (used when device_discovery_mode = "manual")
# e.g., ["/dev/nvme0n1", "/dev/nvme1n1", "/dev/nvme2n1", "/dev/nvme3n1"]
block_devices = []

# Chunk size for striping across devices (default: 4 MiB)
chunk_size_bytes = 4194304

# Starting offset on each device (leaves 4KB header/safety margin)
device_start_offset_bytes = 4096

# Ephemeral In-Memory Metadata (Moka W-TinyLFU)
# Optional override for cache capacity in bytes (if omitted, auto-sizes to total discovered NVMe storage)
# max_cache_capacity_bytes = 5497558138880 # 5.0 TiB

# Dual-Tier Metadata Persistence (Async NVMe sync & instant warm-boot recovery)
metadata_persistence_enabled = true
metadata_persistence_path = "/var/lib/hypercache/metadata.json"

# Tier 1 Host RAM / CXL-Ready Shared Memory Acceleration (/dev/shm)
# Disabled by default. Set to true (or pass --ram) to enable 50-70+ GB/s ephemeral RAM caching.
ram_cache_enabled = false
# Configurable RAM cache capacity in bytes (e.g. 34359738368 = 32 GiB, 17179869184 = 16 GiB, 4294967296 = 4 GiB).
# If omitted or commented out while ram_cache_enabled = true, dynamically auto-sizes to 75% of /dev/shm.
ram_cache_capacity_bytes = 34359738368
ram_cache_shm_path = "/dev/shm/hypercache"

# Authoritative Backend Configuration: "s3" or "nfs" (can also be overridden per-request via URI scheme)
authoritative_backend = "s3"

# NFS / Shared POSIX Filesystem Settings (used when authoritative_backend = "nfs" or URI is file:///nfs://)
nfs_mount_path = "/mnt/nfs"
nfs_read_buffer_bytes = 4194304 # 4 MiB

# Authoritative S3 Store (used when authoritative_backend = "s3" or URI is s3://)
# e.g. for AWS S3: s3_endpoint = "https://s3.us-east-1.amazonaws.com"
s3_endpoint = "http://127.0.0.1:9002"
s3_region = "us-east-1"
s3_bucket = "hypercache-authoritative"
s3_access_key = ""
s3_secret_key = ""

# Write-Through vs. Write-Back Caching Mode
# Disabled by default (false = asynchronous Write-Back for ultra-fast non-blocking checkpoint saves).
# Set to true to enforce synchronous Write-Through (blocking until authoritative S3/NFS confirms write).
# Can also be overridden per-request via write_through=True in Python fsspec or client.
write_through_enabled = false

# Prometheus Metrics Exporter Network Configuration
# OFF by default. Set metrics_enabled = true (or use --metrics) to expose port 9110.
# Default bind to 127.0.0.1 (local scrape only). Set to private subnet IP for Grafana scrapers.
metrics_enabled = false
metrics_bind_address = "127.0.0.1"
metrics_port = 9110

# GPU Node Agent Fleet API (Executes preload/evict directives sent from the Controller)
# OFF by default for single-node use. Automatically enabled when controller_url is configured, or set agent_enabled = true.
agent_enabled = false
agent_bind_address = "0.0.0.0"
agent_http_port = 9115

# Centralized Cluster Controller & Fleet Coordinator Configuration
# If controller_url is set, this node agent will auto-register and send heartbeats every 5s
# controller_url = "http://10.0.0.10:9120"
controller_bind_address = "0.0.0.0"
controller_port = 9120

# Cluster Security Token (Secures Agent HTTP APIs and Controller endpoints)
# Can also be provided via export HYPERCACHE_AUTH_TOKEN="sec-cluster-secret-key"
# cluster_auth_token = "sec-cluster-secret-key"

# Optional Node Labels for selective fleet targeting (--selector "gpu=h100,pool=training")
# [node_labels]
# gpu = "h100"
# pool = "training"

# Development convenience: auto-create backing files if missing
auto_create_mock_devices = true
mock_device_size_bytes = 104857600  # 100 MiB each
