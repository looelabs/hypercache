[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "hypercache-lmcache-native"
description = "LMCache native L2 connector backed by the HyperCache daemon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Looe Labs" }]
keywords = ["lmcache", "vllm", "kv-cache", "nvme", "hypercache"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/looelabs/hypercache"
Documentation = "https://github.com/looelabs/hypercache/blob/main/lmcache-connector/README.md"
Issues = "https://github.com/looelabs/hypercache/issues"

[tool.maturin]
bindings = "pyo3"
module-name = "hypercache_lmcache_native"
features = ["extension-module"]
