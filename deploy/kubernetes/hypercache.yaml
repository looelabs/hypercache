#           mountPath: /var/cache/hypercache
#         # - name: hypercache-shm        # when the RAM tier is enabled
#         #   mountPath: /dev/shm/hypercache
#   volumes:
#     - name: hypercache-socket
#       hostPath: {path: /run/hypercache, type: Directory}
#     - name: hypercache-cache
