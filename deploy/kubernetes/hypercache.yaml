# ==============================================================================
# HyperCache Kubernetes Deployment Manifest (Controller + GPU Worker DaemonSet)
# ==============================================================================
# Deploy with:
#   kubectl apply -f deploy/kubernetes/hypercache.yaml
#
# Architecture in Kubernetes:
#   1. hypercache-controller (Deployment + Service on :9120):
#      Maintains cluster topology, node health, and dispatches parallel preload,
#      consistent-hashed dataset sharding, and P2P chunk distribution.
#   2. hypercache-agent (DaemonSet on GPU Worker Nodes):
#      Runs one agent pod per node, pooling local NVMe storage (via unprivileged
#      O_DIRECT filesystem arenas or raw /dev block devices) and exposing the
#      Unix Domain Socket (/run/hypercache/hypercache.sock) to training/inference
#      pods on the same node via a shared hostPath volume.
#
# Using the cache from a training / inference pod (see the example at the end of this file):
#   - Clients read and write cache files directly at the paths the agent reports, so a client pod
#     must mount the same hostPaths at the SAME mountPaths as the agent (/run/hypercache,
#     /var/cache/hypercache, and /dev/shm/hypercache when the RAM tier is enabled).
#   - The agent runs as root and shares the socket and cache files with client_gid (2000 below).
#     Client pods that run as non-root add that group via securityContext.supplementalGroups.
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: hypercache-system
---
apiVersion: v1
kind: Secret
metadata:
  name: hypercache-credentials
  namespace: hypercache-system
type: Opaque
stringData:
  HYPERCACHE_AUTH_TOKEN: "replace-with-your-cluster-auth-token"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hypercache-config
  namespace: hypercache-system
data:
  hypercache-controller.toml: |
    controller_bind_address = "0.0.0.0"
    controller_port = 9120
    cluster_auth_token = "$HYPERCACHE_AUTH_TOKEN"
    p2p_preload_enabled = true
    # In Kubernetes, sidecar proxies and `kubectl port-forward` deliver remote traffic from
    # 127.0.0.1, so the zero-config loopback bypass must be off: every call needs the token.
    allow_local_admin_bypass = false

  hypercache-agent.toml: |
    socket_path = "/run/hypercache/hypercache.sock"

    # Standard Kubernetes Mode: Direct I/O (O_DIRECT) Arena on Node-Local NVMe Mount
    # (To use raw unmounted /dev/nvme* block devices instead, set storage_backing_mode = "raw_block"
    # and uncomment the privileged /dev volumeMount in the DaemonSet below. The agent then shares
    # the claimed devices with client_gid, but client pods must also be privileged (or get the
    # device from a device plugin): the runtime blocks block devices in unprivileged pods.)
    storage_backing_mode = "filesystem"
    filesystem_cache_paths = ["/var/cache/hypercache"]
    # The arena's space is reserved when the agent starts: if the node's disk cannot hold it, the
    # agent refuses to start and logs the required and free bytes. Size it to the node's NVMe.
    # Client pods running as non-root need this group (supplementalGroups: [2000]).
    client_gid = 2000
    # Tier 1 RAM: a pod's /dev/shm is private, so RAM-tier files must live on a hostPath that
    # client pods mount at the same path. Enable together with the host-shm volume below.
    # ram_cache_enabled = true
    # ram_cache_shm_path = "/dev/shm/hypercache"
    filesystem_arena_size_bytes = 107374182400 # 100 GiB per node NVMe directory

    chunk_size_bytes = 4194304
    metadata_persistence_enabled = true
    metadata_persistence_path = "/var/lib/hypercache/metadata.json"

    # Authoritative S3 / Object Store Settings
    authoritative_backend = "s3"
    s3_endpoint = "https://s3.us-east-1.amazonaws.com"
    s3_region = "us-east-1"
    s3_bucket = "hypercache-authoritative"
    s3_access_key = "$AWS_ACCESS_KEY_ID"
    s3_secret_key = "$AWS_SECRET_ACCESS_KEY"
    # Prefer short-lived credentials (IRSA / EKS Pod Identity): leave the static keys empty in
    # the Secret and the AWS_SESSION_TOKEN env var injected by the platform is used automatically.
    s3_parallel_streams = 8

    # file:// / nfs:// URIs are confined to nfs_mount_path and nfs_allowed_paths
    # nfs_mount_path = "/mnt/nfs"
    # nfs_allowed_paths = ["/mnt/datasets"]

    # Cluster Registration
    controller_url = "http://hypercache-controller.hypercache-system.svc.cluster.local:9120"
    cluster_auth_token = "$HYPERCACHE_AUTH_TOKEN"
    agent_enabled = true
    agent_bind_address = "0.0.0.0"
    agent_http_port = 9115

    # Prometheus Telemetry
    metrics_enabled = true
    metrics_bind_address = "0.0.0.0"
    metrics_port = 9110
---
# ==============================================================================
# 1. Central Cluster Controller (Deployment + ClusterIP Service)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypercache-controller
  namespace: hypercache-system
  labels:
    app: hypercache-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hypercache-controller
  template:
    metadata:
      labels:
        app: hypercache-controller
    spec:
      containers:
        - name: controller
          image: ghcr.io/looelabs/hypercache:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/hypercache-admin"]
          args: ["-c", "/etc/hypercache/hypercache-controller.toml", "controller"]
          envFrom:
            - secretRef:
                name: hypercache-credentials
          ports:
            - name: controller-http
              containerPort: 9120
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 9120
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9120
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/hypercache
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: hypercache-config
---
apiVersion: v1
kind: Service
metadata:
  name: hypercache-controller
  namespace: hypercache-system
  labels:
    app: hypercache-controller
spec:
  selector:
    app: hypercache-controller
  ports:
    - name: http
      port: 9120
      targetPort: 9120
      protocol: TCP
---
# ==============================================================================
# 2. GPU Worker Node Agent (DaemonSet)
# ==============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hypercache-agent
  namespace: hypercache-system
  labels:
    app: hypercache-agent
spec:
  selector:
    matchLabels:
      app: hypercache-agent
  template:
    metadata:
      labels:
        app: hypercache-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9110"
        prometheus.io/path: "/metrics"
    spec:
      # Optional: Restrict DaemonSet to GPU worker nodes
      # nodeSelector:
      #   nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: ghcr.io/looelabs/hypercache:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/hypercache"]
          args: ["-c", "/etc/hypercache/hypercache-agent.toml", "start", "--agent", "--metrics"]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HYPERCACHE_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          envFrom:
            - secretRef:
                name: hypercache-credentials
          # Uncomment securityContext below ONLY if using storage_backing_mode = "raw_block" on raw /dev/nvme* devices:
          # securityContext:
          #   privileged: true
          ports:
            - name: agent-api
              containerPort: 9115
              protocol: TCP
            - name: metrics
              containerPort: 9110
              protocol: TCP
          # `hypercache status` exits non-zero when the daemon does not answer on its socket
          readinessProbe:
            exec:
              command: ["/usr/local/bin/hypercache", "status"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/local/bin/hypercache", "status"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/hypercache
              readOnly: true
            - name: socket-dir
              mountPath: /run/hypercache
            - name: nvme-cache-dir
              mountPath: /var/cache/hypercache
            - name: metadata-dir
              mountPath: /var/lib/hypercache
            # Uncomment together with ram_cache_enabled in the ConfigMap:
            # - name: host-shm
            #   mountPath: /dev/shm/hypercache
            # Uncomment /dev mount below ONLY if using storage_backing_mode = "raw_block":
            # - name: host-dev
            #   mountPath: /dev
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
      volumes:
        - name: config
          configMap:
            name: hypercache-config
        - name: socket-dir
          hostPath:
            path: /run/hypercache
            type: DirectoryOrCreate
        - name: nvme-cache-dir
          hostPath:
            # Point this to the node's local NVMe mount (e.g., /mnt/nvme0/hypercache)
            path: /var/cache/hypercache
            type: DirectoryOrCreate
        - name: metadata-dir
          hostPath:
            path: /var/lib/hypercache
            type: DirectoryOrCreate
        # - name: host-shm
        #   hostPath:
        #     path: /dev/shm/hypercache
        #     type: DirectoryOrCreate
        # Uncomment host-dev volume ONLY if using storage_backing_mode = "raw_block":
        # - name: host-dev
        #   hostPath:
        #     path: /dev
        #     type: Directory
---
# ==============================================================================
# 3. Network isolation for the Agent Fleet API
# ==============================================================================
# The agent API (:9115) can purge the cache and write replicas to local NVMe. Only the
# controller (fleet dispatch) and other agents (P2P chunk pulls, checkpoint replicas) may
# reach it. Metrics (:9110) stay reachable for in-cluster Prometheus scraping.
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, AWS VPC CNI with policies, ...).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hypercache-agent-api
  namespace: hypercache-system
spec:
  podSelector:
    matchLabels:
      app: hypercache-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hypercache-controller
        - podSelector:
            matchLabels:
              app: hypercache-agent
      ports:
        - protocol: TCP
          port: 9115
    - ports:
        - protocol: TCP
          port: 9110
---
# ==============================================================================
